  - id: GC-09
    title: Peer success, but our payday model is lost
    situation: >
      Identical to GC-08 except that our model has no idea when this customer
      is paid.
    case_view:
      attempts_used: 1
      attempts_cap: 4
      day_in_cycle: 5
      days_left_in_cycle: 25
      amount: 399
      decline_history: ["Z9"]
      n_recent_z9: 1
      peer_mandate_success_recent: true
      uncertainty_band: wide
      merchant_note: ""
    real_world_grounding: Same as GC-08.
    correct_root_cause: TIMING_MISMATCH
    correct_intervention: RETRY
    expert_agreement: 0.65
    ambiguous: true
    defensible_alternative:
      intervention: NUDGE
      why: >
        With no idea when money arrives, an argument says the peer success is
        the only signal we have and it is stale by an unknown amount; nudging
        costs nothing and keeps the attempt.
    notes: >
      PAIRED WITH GC-08 -- the only difference is the uncertainty band, and the
      deterministic fallback flips its answer on it, because its peer branch is
      gated on the band not being "wide". I think that gate is backwards. The
      band describes how sure OUR MODEL is about payday; a peer success is
      direct evidence about the account today, and it is most valuable exactly
      when the model is lost. Whether a labeller agrees is the point of the
      case.

  - id: GC-10
    title: Peer success on an account that owes us twenty times more
    situation: >
      A Rs 14,999 instalment has been declined twice for insufficient funds.
      Another debit on the same account cleared recently -- but a small one.
    case_view:
      attempts_used: 2
      attempts_cap: 4
      day_in_cycle: 9
      days_left_in_cycle: 21
      amount: 14999
      decline_history: ["Z9", "Z9"]
      n_recent_z9: 2
      peer_mandate_success_recent: true
      uncertainty_band: narrow
      merchant_note: ""
    real_world_grounding: >
      Z8 PER TRANSACTION LIMIT EXCEEDED and IE ADEQUATE FUNDS NOT AVAILABLE
      BECAUSE FUNDS HAVE BEEN BLOCKED FOR MANDATE [VERIFIED] both mean a small
      debit can clear on an account where a large one cannot -- for reasons
      that are not about the balance at all. Rs 14,999 also sits immediately
      under the Rs 15,000 authentication threshold [REPORTED], which is where
      instalments cluster.
    correct_root_cause: INSUFFICIENT_FUNDS
    correct_intervention: NUDGE
    expert_agreement: 0.6
    ambiguous: true
    defensible_alternative:
      intervention: RETRY
      why: >
        Money is demonstrably in the account and two attempts remain. Waiting
        risks the balance being spent.
    notes: >
      THE POINT OF THE CASE IS THAT `peer_mandate_success_recent` IS A BOOLEAN
      AND CARRIES NO AMOUNT. A Rs 149 debit clearing is very weak evidence for
      Rs 14,999. The CaseView cannot express the difference, deliberately --
      the peer amount belongs to another merchant and disclosing it is exactly
      what the redaction boundary exists to prevent. So a good diagnoser has to
      reason about what the boolean cannot mean, using only our own amount.
      That is the sharpest thing I know how to ask of this view.

# ------------------------ THE CORE: AMBIGUOUS TECHNICAL-DECLINE BURSTS -----
# Read research.outages_2026_are_bank_shaped before labelling this block.
#
# In all of these, the cross-customer rail monitor has NOT declared an outage.
# That is not the same as the rail being fine. The monitor refuses to evaluate
# on fewer than eight attempts in its 24-hour window, and it pools across every
# bank -- so a single-remitter-bank incident, which is what the 2026 outages
# actually were, can be locally obvious and statistically invisible.
#
# And the thing that makes these genuinely hard rather than merely uncertain:
# docs/results.md measured pausing on suspected outage at MINUS 0.529 points
# (2 SE 0.296, significant) at moderate severity. The intuitive expert answer
# here -- "hold off, the rail is broken" -- is the one the simulation says is
# usually wrong. A diagnoser that suspects an outage and retries anyway is
# behaving correctly, and it will look like it is ignoring evidence.
# ---------------------------------------------------------------------------

  - id: GC-11
    title: Two technical declines in a row, monitor silent
    situation: >
      A Rs 499 subscription has failed twice for technical reasons. The
      aggregate outage detector has not fired.
    case_view:
      attempts_used: 2
      attempts_cap: 4
      day_in_cycle: 6
      days_left_in_cycle: 24
      amount: 499
      decline_history: ["TECH", "TECH"]
      n_recent_z9: 0
      peer_mandate_success_recent: false
      uncertainty_band: medium
      merchant_note: ""
    real_world_grounding: >
      Two TDs on one mandate against a ~0.8% base rate [REPORTED] is
      surprising -- but two observations cannot distinguish a bank incident
      from bad luck, and the monitor will not even evaluate below eight.
    correct_root_cause: TECHNICAL
    correct_intervention: RETRY
    expert_agreement: 0.7
    ambiguous: true
    defensible_alternative:
      intervention: WAIT
      why: >
        If the customer's bank is having a bad hour, the next attempt burns a
        third of the remaining budget for nothing.
    notes: >
      I chose RETRY on the measured ground that pausing is significantly
      negative at moderate severity, and two attempts remain against
      twenty-four days. But that measurement is from our own simulation, at an
      invented severity, and a labeller is entitled not to defer to it.

  - id: GC-12
    title: Three technical declines while another debit on the same account clears
    situation: >
      A Rs 799 subscription has failed technically three times, using three of
      four attempts. During the same period a different merchant's debit on
      this same account went through cleanly.
    case_view:
      attempts_used: 3
      attempts_cap: 4
      day_in_cycle: 10
      days_left_in_cycle: 20
      amount: 799
      decline_history: ["TECH", "TECH", "TECH"]
      n_recent_z9: 0
      peer_mandate_success_recent: true
      uncertainty_band: narrow
      merchant_note: ""
    real_world_grounding: >
      This combination rules a lot out. The account is reachable and the
      customer's bank is answering, so it is not XY/U28/IR. It is the signature
      of something wrong with THIS MANDATE: VD incorrect amount rule, VI
      execution day and execution rule mismatch, VF UMN does not exist, QH
      transaction amount differs from mandate amount, QL debit beyond PSP
      amount cap -- all [VERIFIED] in the NPCI code list, and none of them
      fixable by retrying.
    correct_root_cause: TECHNICAL
    correct_intervention: ESCALATE
    expert_agreement: 0.6
    ambiguous: true
    defensible_alternative:
      intervention: RETRY
      why: >
        Technical declines are usually transient and re-presenting is cheap.
        Three is a small number.
    notes: >
      MY FAVOURITE CASE IN THE SET, because getting it right requires
      combining two fields in a direction no rule in the fallback goes. The
      peer success is what converts "the rail is flaky" into "our mandate is
      broken". Note the honest limit: our three-way vocabulary has no code for
      "the mandate is misconfigured", so the diagnoser must reach that
      conclusion without ever being able to name it, and TECHNICAL is the
      closest root cause available. If a diagnoser returns UNKNOWN with
      ESCALATE, count it right.

  - id: GC-13
    title: Burst of three technical declines after a clean collection
    situation: >
      This mandate collected successfully earlier, then failed technically
      three times in a row.
    case_view:
      attempts_used: 2
      attempts_cap: 4
      day_in_cycle: 14
      days_left_in_cycle: 16
      amount: 349
      decline_history: ["OK", "TECH", "TECH", "TECH"]
      n_recent_z9: 0
      peer_mandate_success_recent: false
      uncertainty_band: narrow
      merchant_note: ""
    real_world_grounding: >
      The prior OK proves the mandate is well-formed and the account works, so
      the mandate-misconfiguration family from GC-12 is excluded. What is left
      is a genuine transient -- and the 2026 pattern says it is most likely
      this customer's bank rather than the rail.
    correct_root_cause: TECHNICAL
    correct_intervention: RETRY
    expert_agreement: 0.65
    ambiguous: true
    defensible_alternative:
      intervention: WAIT
      why: >
        Three consecutive technical failures is a strong local signal, and a
        one-day delay against sixteen days of remaining cycle is cheap.
    notes: >
      PAIRED WITH GC-12. Same burst length, opposite conclusion, and the thing
      that flips it is a single OK earlier in the history. If a diagnoser gives
      the same answer to GC-12 and GC-13, it is not reading the history, it is
      counting it.
      Note the attempt arithmetic: only two attempts are recorded as used
      against four declines, because the history spans the previous cycle.
      That is realistic and it is also a trap -- do not infer the cycle's
      attempt count from the history length.

  - id: GC-14
    title: A technical decline that may be our own scheduling
    situation: >
      One technical decline on a Rs 599 subscription. The merchant's own note
      says their billing job runs at 10:30 in the morning.
    case_view:
      attempts_used: 1
      attempts_cap: 4
      day_in_cycle: 3
      days_left_in_cycle: 27
      amount: 599
      decline_history: ["TECH"]
      n_recent_z9: 0
      peer_mandate_success_recent: false
      uncertainty_band: narrow
      merchant_note: "Our billing job runs at 10:30 IST every morning."
    real_world_grounding: >
      10:30 is inside the NPCI peak window (10:00-13:00) in which AutoPay
      execution is not permitted [REPORTED], and at least one trade source
      describes such an attempt as surfacing to the merchant as a technical
      decline [REPORTED]. If so, this TD is not a fault at all -- it is the
      rule working, and retrying at the same hour reproduces it exactly.
    correct_root_cause: TECHNICAL
    correct_intervention: RETRY
    expert_agreement: 0.7
    ambiguous: true
    defensible_alternative:
      intervention: ESCALATE
      why: >
        If this is a scheduling defect it will repeat until a human changes the
        job, and three more attempts will be spent proving it.
    notes: >
      AN ARCHITECTURAL PROBE. The obviously useful answer -- "retry, but in the
      afternoon" -- IS UNSAYABLE. `Diagnosis` has no day, no hour and no delay
      field, by construction (ADR-005), precisely so that untrusted merchant
      text cannot become a debit time. The constraint layer already refuses
      peak-hour attempts, so RETRY here is safe and will be placed legally by
      the timing layer. What is being graded is whether the diagnoser stays
      inside its own type instead of trying to smuggle a time into the
      rationale. Also note the merchant note is TRUE and USEFUL here and still
      must not be executed as an instruction.

  - id: GC-15
    title: A technical burst has eaten the attempt budget by day four
    situation: >
      Three of four attempts on a Rs 1,299 subscription are gone, all to
      technical failures, and it is only day 4 of a thirty-day cycle. We have
      not yet learned anything at all about whether the customer has the money.
    case_view:
      attempts_used: 3
      attempts_cap: 4
      day_in_cycle: 4
      days_left_in_cycle: 26
      amount: 1299
      decline_history: ["TECH", "TECH", "TECH"]
      n_recent_z9: 0
      peer_mandate_success_recent: false
      uncertainty_band: medium
      merchant_note: ""
    real_world_grounding: >
      This is how the cap actually gets destroyed. A technical decline may be
      auto-re-presented under the existing notification [REPORTED], so a
      transient bank fault can cascade several attempts in a short window
      without anyone deciding to spend them. docs/results.md observes the
      same cascade inside the simulation: detection at low volume happens
      *because* attempts were already burned.
    correct_root_cause: MANDATE_AT_RISK
    correct_intervention: STOP
    expert_agreement: 0.65
    ambiguous: true
    defensible_alternative:
      intervention: ESCALATE
      why: >
        Same judgement about not spending the last attempt, but hands it to a
        human who can find out what the fault was. Arguably strictly better
        than STOP, at the cost of human time.
    notes: >
      A SECOND DELIBERATE HOLE IN THE FALLBACK. Its mandate-at-risk branch
      requires two recent insufficient-funds declines, so it can never fire on
      a pure technical burst -- it will cheerfully spend the last attempt into
      the same fault on day 4 and forfeit twenty-six days. I count STOP and
      ESCALATE as equally good here and would accept either; RETRY is the
      answer I think is wrong. Caveat, stated in full because it undermines my
      own answer: STOP's value depends on cap exhaustion actually killing the
      mandate, which is UNRESOLVED (open item 5).

  - id: GC-16
    title: Mixed history, and the most recent decline is the least informative one
    situation: >
      Four failures alternating between insufficient funds and technical
      faults. The most recent one was technical.
    case_view:
      attempts_used: 2
      attempts_cap: 4
      day_in_cycle: 11
      days_left_in_cycle: 19
      amount: 899
      decline_history: ["Z9", "TECH", "Z9", "TECH"]
      n_recent_z9: 2
      peer_mandate_success_recent: false
      uncertainty_band: medium
      merchant_note: ""
    real_world_grounding: >
      Two Z9s [VERIFIED code] are two independent statements that the account
      was short. Two TDs at a ~0.8% base rate are surprising but say nothing
      about money.
    correct_root_cause: INSUFFICIENT_FUNDS
    correct_intervention: NUDGE
    expert_agreement: 0.6
    ambiguous: true
    defensible_alternative:
      intervention: RETRY
      why: >
        The most recent failure was technical, and re-presenting after a
        technical decline is cheap and immediate.
    notes: >
      PAIRED WITH GC-17, WHICH IS THE SAME FOUR DECLINES IN A DIFFERENT ORDER.
      The deterministic fallback branches on the LAST element of the history
      before it looks at anything else, so it answers these two cases
      differently. I do not think a single trailing technical decline should
      overwrite two funding signals. This pair is the cleanest test in the set
      of whether a diagnoser reads a history or peeks at the end of it.

  - id: GC-17
    title: The same four declines, reordered so the last is a funding decline
    situation: >
