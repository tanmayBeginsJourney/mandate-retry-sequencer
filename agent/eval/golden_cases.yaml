      merchant_note: ""
    real_world_grounding: >
      Any of XY (remitter CBS offline), U28 (remitter bank not available), IR,
      UP (PSP time-out), U67 (debit timeout) [VERIFIED]. At a ~0.8% system TD
      rate [REPORTED] one of these in isolation is noise.
    correct_root_cause: TECHNICAL
    correct_intervention: RETRY
    expert_agreement: 0.9
    ambiguous: false
    defensible_alternative: null
    notes: >
      A technical decline may be re-presented under the existing notification
      [REPORTED], so this retry is immediate rather than costing a day. This is
      the case the whole technical/business split exists for.

# ------------------------------------------------ FUNDING AND PEER SIGNAL ---

  - id: GC-05
    title: Thin account, three declines, one attempt left, cycle far from over
    situation: >
      A Rs 1,499 gym subscription has been declined for insufficient funds
      three times. One attempt remains and eighteen days of the cycle are left.
    case_view:
      attempts_used: 3
      attempts_cap: 4
      day_in_cycle: 12
      days_left_in_cycle: 18
      amount: 1499
      decline_history: ["Z9", "Z9", "Z9"]
      n_recent_z9: 3
      peer_mandate_success_recent: false
      uncertainty_band: medium
      merchant_note: ""
    real_world_grounding: >
      The 20-million-revocations-a-month population [REPORTED]: accounts that
      simply do not hold the balance when the debit lands.
    correct_root_cause: INSUFFICIENT_FUNDS
    correct_intervention: NUDGE
    expert_agreement: 0.55
    ambiguous: true
    defensible_alternative:
      intervention: STOP
      why: >
        One attempt from the cap. If exhausting the cap kills the mandate, the
        last attempt risks every future cycle to chase one, and holding it back
        is the conservative play.
    notes: >
      THIS IS ONE OF THE MOST ARGUABLE CASES IN THE SET AND I EXPECT TO LOSE
      HALF THE LABELS. My reasoning: STOP is a permanent forfeit of this
      cycle's money, taken on day 12 of 30, when the free option -- ask the
      customer to fund the account -- has not been tried. Nudge now, and the
      last attempt is still there afterwards, better informed. The counter is
      that we have three pieces of evidence saying the account is empty and a
      nudge is unlikely to change that. Both are honest. Note also that STOP's
      measured value in docs/results.md depends entirely on the cycle-based
      metric and the 120-day horizon, and mandate survival on the shipping
      configuration is already 96.55% -- so the thing STOP protects is rarer
      than it feels.

  - id: GC-06
    title: Three declines, one attempt left, cycle closing in three days
    situation: >
      A Rs 649 subscription, declined three times for insufficient funds, with
      one attempt and three days left. We do not know when this customer is
      paid.
    case_view:
      attempts_used: 3
      attempts_cap: 4
      day_in_cycle: 27
      days_left_in_cycle: 3
      amount: 649
      decline_history: ["Z9", "Z9", "Z9"]
      n_recent_z9: 3
      peer_mandate_success_recent: false
      uncertainty_band: wide
      merchant_note: ""
    real_world_grounding: Same population as GC-05, at the other end of the cycle.
    correct_root_cause: INSUFFICIENT_FUNDS
    correct_intervention: ESCALATE
    expert_agreement: 0.6
    ambiguous: true
    defensible_alternative:
      intervention: RETRY
      why: >
        Three days left and one unspent attempt. If payday has landed since the
        last decline the money is there now, and after the cycle closes the
        attempt is worthless. Spending it is not obviously wrong.
    notes: >
      The tension is that RETRY is nearly free in cycle terms and expensive in
      mandate terms, and which dominates depends on the unresolved question of
      whether cap exhaustion cancels the mandate (see
      research.what_i_could_not_find). I chose ESCALATE because a human can act
      inside three days and cannot after.

  - id: GC-07
    title: Last attempt, and another debit on the same account just cleared
    situation: >
      A Rs 2,499 mandate has been declined three times for insufficient funds,
      leaving one attempt -- but a different merchant's debit on this same
      account succeeded in the last few days, and we are confident about the
      payday.
    case_view:
      attempts_used: 3
      attempts_cap: 4
      day_in_cycle: 8
      days_left_in_cycle: 22
      amount: 2499
      decline_history: ["Z9", "Z9", "Z9"]
      n_recent_z9: 3
      peer_mandate_success_recent: true
      uncertainty_band: narrow
      merchant_note: ""
    real_world_grounding: >
      The cross-merchant signal. Its legality is the project's biggest
      unresolved question (docs/results.md, tagged [GUESS] and unread), and
      this case is worthless if it resolves the wrong way.
    correct_root_cause: TIMING_MISMATCH
    correct_intervention: RETRY
    expert_agreement: 0.7
    ambiguous: true
    defensible_alternative:
      intervention: STOP
      why: >
        A peer success tells us money arrived; it does not tell us Rs 2,499 of
        it is still there, and the peer debit may have been much smaller. If
        this attempt fails the mandate may be gone.
    notes: >
      A DELIBERATE PROBE OF THE DETERMINISTIC FALLBACK. Its mandate-at-risk
      branch is evaluated before it ever looks at the peer signal, so it will
      STOP here and never see the best evidence in the case. If a
      model-backed diagnoser gets this right and the fallback does not, that
      is a real, specific thing the LLM layer bought.

  - id: GC-08
    title: One decline, then a peer success
