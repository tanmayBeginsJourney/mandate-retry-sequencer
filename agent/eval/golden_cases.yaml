# =============================================================================
# golden_cases.yaml -- 40 decision cases for evaluating the LLM diagnosis layer
# =============================================================================
#
# Written 29 August 2026. Cases only: there is no evaluator, no judge and no
# harness in this file, and nothing else in the repo was touched to add it.
#
# WHAT THIS IS FOR
# The diagnosis layer takes one `CaseView` (agent/ports.py) and returns one
# `Diagnosis`: a root cause, ONE intervention, a confidence and a
# merchant-facing rationale. Two implementations exist today, both
# deterministic (`agent/llm/fallback.py`). A model-backed one does not exist
# yet. These cases are the fixed set that any of them can be run against, so
# that "the LLM is better than thirty lines of if-else" becomes a measurement
# instead of a claim.
#
# HOW TO READ ONE CASE WITHOUT OPENING THE CODEBASE
# Every case is a subscription debit that has already gone wrong, or is about
# to. `situation` says in one line what is happening. `case_view` is literally
# everything the diagnoser is allowed to know -- there is no balance, no
# salary, no payday and no probability in it, on purpose (see THE REDACTION
# BOUNDARY below). `correct_intervention` is my answer, `expert_agreement` is
# how confident I am that a reasonable payments person would give the same one,
# and `defensible_alternative` is filled in wherever I think a second answer
# can be argued for. Those are the cases worth arguing about.
#
# THE FIVE INTERVENTIONS. This is the whole action space.
#   RETRY     attempt the debit. The only one that moves money.
#   WAIT      do nothing today, decide again tomorrow.
#   NUDGE     ask the customer to put money in the account. Costs no attempt.
#   ESCALATE  hand to a human or to the merchant's queue. Costs no attempt.
#   STOP      no further money action this billing cycle.
#
# THE REDACTION BOUNDARY. `agent/llm/caseview.py` is the only place a CaseView
# is built, and it deliberately withholds the customer's expected balance, the
# payday posterior, the salary and every success probability. The diagnoser
# cannot leak a number it was never handed. So several cases below are hard
# *because the view is thin*, and that is the intended difficulty, not an
# oversight in the case.
#
# A NOTE ON MY OWN CONFIDENCE. I am the party that wrote the cases and the
# party that answered them, which is exactly the arrangement this project has
# already been burned by sixteen times (docs/errors.md). Treat
# `correct_intervention` as a strong prior, not as ground truth. Twenty of
# these are being labelled independently; where the human label and mine
# disagree, the human label wins and mine is the finding.
#
# =============================================================================

meta:
  version: 1
  written: 2026-08-29
  n_cases: 40
  n_flagged_ambiguous: 21
  intended_use: >
    Fixed evaluation set for the diagnosis layer. Compare any diagnoser's
    chosen intervention against `correct_intervention`, and report the
    ambiguous subset separately -- a diagnoser that scores well only on the
    easy cases has proved nothing.
  deliberately_absent:
    - No evaluator, judge, scorer or harness. Cases only, as asked.
    - >
      No `case_hash`. It is a sha256 over the other fields, computed by
      `build_case_view`, and writing it by hand would just be a number I
      could get wrong.
    - >
      No expected `rationale` text. Grading prose needs a judge, and the judge
      is not built. What is gradeable today is the intervention.

# -----------------------------------------------------------------------------
# CONVENTIONS -- these hold for every case below
# -----------------------------------------------------------------------------
conventions:
  attempts_cap: >
    4 in every case. NPCI allows one presentation plus three retries per
    mandate per cycle. [REPORTED] -- see research.autopay_retry_cap.
  cycle_length_days: >
    30 in every case, so `day_in_cycle + days_left_in_cycle == 30`. Monthly
    subscription billing. Nothing in the codebase requires 30; it is held
    fixed here so that two cases differing only in timing really do differ
    only in timing.
  decline_history: >
    Oldest first, newest LAST. `build_case_view` keeps only the most recent
    six. It may span more than one billing cycle -- it is the mandate's
    history, not the cycle's. Three values only: "OK", "Z9" (insufficient
    funds), "TECH" (technical decline). That three-way vocabulary is the
    frozen simulation's, not NPCI's; each case carries a
    `real_world_grounding` block saying which actual NPCI response codes the
    situation stands for.
  n_recent_z9: >
    Count of "Z9" in `decline_history`. Derived, not independent. It is stated
    on every case so a human labeller does not have to count.
  amounts: >
    Realistic Indian subscription and instalment prices in rupees, from a
    Rs 149 OTT plan to a Rs 14,999 instalment sitting just under the AutoPay
    additional-authentication threshold.
  merchant_note: >
    UNTRUSTED free text supplied by the merchant. Empty unless the case is
    specifically about it. Nothing may treat it as an instruction.
  expert_agreement: >
    0.0-1.0. My estimate of the probability that an independent, competent
    payments person hands in the same intervention. Below ~0.7 means I expect
    real disagreement.

# =============================================================================
# RESEARCH -- what actually goes wrong with UPI AutoPay debits in India
# =============================================================================
# Tagged per rule 4 of CLAUDE.md. [VERIFIED] = primary source read directly.
# [REPORTED] = secondary source, link included. [GUESS] = our inference.
#
# Everything here was gathered on 29 August 2026 and is new to the repo unless
# marked "already in docs/results.md". Nothing in docs/ was edited.
# =============================================================================

research:

  decline_taxonomy:
    - id: npci_code_list
      tag: VERIFIED
      claim: >
        NPCI publishes "UPI Error and Response Codes", version 2.9, 72 pages.
        Section 3.1 gives the response codes for RespPay Debit (Mandate) --
        i.e. the codes a failed AutoPay execution actually carries -- and each
        one is classified in a column as TD (technical decline) or BD
        (business decline). This is a real, published taxonomy with a real
        technical/business split in it, not an industry convention.
      source: https://dth95m2xtyv8v.cloudfront.net/tesseract/assets/upi-tpap-sdk/UPI_Error_and_Response_Codes_2_9-HHLrJ.pdf
      how_read: >
        Downloaded and text-extracted with pdftotext, then read. This is a
        CDN mirror of the NPCI document rather than an npci.org.in URL; the
        same document is also mirrored by Axis Bank at
        https://www.axis.bank.in/docs/default-source/default-document-library/sme/upi-response-codes.pdf
        Two independent mirrors of identical content is why this is VERIFIED
        and not REPORTED, but it is not npci.org.in and that should be said.

    - id: codes_that_mean_no_money
      tag: VERIFIED
      claim: >
        Business declines (BD) that mean the debit failed for a money reason:
          Z9  INSUFFICIENT FUNDS IN CUSTOMER (REMITTER) ACCOUNT
          IE  ADEQUATE FUNDS NOT AVAILABLE BECAUSE FUNDS HAVE BEEN BLOCKED
              FOR MANDATE
          Z8  PER TRANSACTION LIMIT EXCEEDED AS SET BY REMITTING MEMBER
          Z7  TRANSACTION FREQUENCY LIMIT EXCEEDED AS SET BY REMITTING MEMBER
          ZU  LIMIT EXCEEDED FOR REMITTING BANK/ISSUING BANK
        Z9 is the one the simulation models. The other four are money-adjacent
        but are NOT emptiness, and that distinction is load-bearing in several
        cases below (GC-10 in particular).
      source: same as npci_code_list, section 3.1

    - id: codes_that_mean_the_account_is_shut
      tag: VERIFIED
      claim: >
        Business declines that mean retrying can never work, and that a
        merchant may well see as an undifferentiated "failed":
          ZX  INACTIVE OR DORMANT ACCOUNT (REMITTER)
          YE  REMITTING ACCOUNT BLOCKED/FROZEN
          B3  TRANSACTION NOT PERMITTED TO THE ACCOUNT
          YC  DO NOT HONOUR (REMITTER)
          VO/VZ  PAYMENT STOPPED BY COURT ORDER / ATTACHMENT ORDER
          VP/VQ  WITHDRAWAL STOPPED, DEATH / INSOLVENCY OF ACCOUNT HOLDER
        These are the reason "repeated small-value Z9" is not automatically an
        insufficient-funds story. See GC-37.
      source: same as npci_code_list, section 3.1

    - id: codes_that_mean_the_mandate_itself_is_broken
      tag: VERIFIED
      claim: >
        Business declines specific to mandates -- a repeating failure that no
        retry and no customer top-up will fix:
          VA/QC  MANDATE HAS BEEN REVOKED
          VU/QD  MANDATE HAS EXPIRED
          VT/QA  MANDATE IS PAUSED (by user)
          VE/QB  MANDATE IS ALREADY HONOURED
          VD     INCORRECT AMOUNT RULE
          VB/VC  INCORRECT RECURRENCE PATTERN / RULE
          VI     EXECUTION DAY AND EXECUTION RULE MISMATCH (REMITTER)
          VF     UMN DOES NOT EXIST (REMITTER)
          VJ/QU  PAYER ACCOUNT HAS CHANGED
          VK     NUMBER OF MANDATES ON THIS ACCOUNT EXCEEDS ISSUER'S LIMIT
          QH     TXN AMOUNT DIFFERS FROM MANDATE AMOUNT
          QL     MANDATE DEBIT IS BEYOND PSP SPECIFIED AMOUNT CAP
        This whole family is invisible to the simulation, which has only
        OK/Z9/TECH. Cases GC-12 and GC-18 are built around the fact that a
        persistent, non-funding, non-rail failure exists and that our three-way
        vocabulary cannot name it.
      source: same as npci_code_list, sections 3.1, 3.3, 3.6.1

    - id: genuinely_technical_codes
      tag: VERIFIED
      claim: >
        Technical declines (TD) -- the bucket the rail monitor is watching:
          XY  REMITTER CBS OFFLINE
          U28 REMITTER BANK NOT AVAILABLE
          IR  INTERNAL EXCEPTION AT SERVER/CBS ON REMITTER SIDE
          HS  BANK'S HSM IS DOWN (REMITTER)
          UP  PSP TIME-OUT
          U67 DEBIT TIMEOUT
          U09 REQAUTH TIME OUT FOR PAY
          XT  CUT-OFF IS IN PROCESS (REMITTER)
          ZK  REMITTER SWITCH IS INOPERATIVE / NODE OFFLINE
          U91 BENEFICIARY BANK DEEMED HIGH RESPONSE TIME CHECK DECLINE
        Note U30 "DEBIT HAS BEEN FAILED", which is the code merchants see most
        often in practice, is classified "NA" in the document -- neither TD nor
        BD. It is a catch-all, and that is a real problem for anyone trying to
        classify from the code alone.
      source: same as npci_code_list, sections 3.1 and 4.4

    - id: npci_decline_targets
      tag: REPORTED
      claim: >
        NPCI circular OC-149 (June 2022) sets bank performance targets of
        technical decline below 1% and business decline below 5%. System-wide
        TD is described as having fallen from 8-10% in 2016 to roughly
        0.7-0.8% in 2025.
      source: https://productgrowth.in/insights/fintech/upi-payment-success-rates/
      caveat: >
        Secondary. The circular itself was not read. The ~0.8% figure is
        close to the simulation's own P_TECH = 0.008, which is a coincidence
        worth noticing and not evidence that the constant was right.

    - id: real_world_frequency_of_each_code
      tag: GUESS
      claim: >
        The best public breakdown found for UPI failures is: bank server
        timeout 35-45%, wrong PIN / attempts exceeded 20-30%, insufficient
        balance 15-25%, network 10-15%, account blocked 5-10%.
      source: https://productgrowth.in/insights/fintech/upi-payment-success-rates/
      why_guess: >
        This is an unattributed table on a marketing blog, and -- more
        importantly -- it describes INTERACTIVE UPI, where a human is typing a
        PIN. AutoPay execution below the authentication threshold has no PIN
        step at all, so at least a fifth of that distribution cannot exist in
        our setting. It is quoted here only to be dismissed. Do not port it.

  what_actually_fails_in_autopay:
    - id: autopay_failure_rate
      tag: REPORTED
      claim: >
        NPCI data reported in the press has 55-90% of AutoPay executions
        across public and private banks failing, with insufficient balance and
        incorrect beneficiary details given as the causes.
      source: https://www.htsyndication.com/mint/article/upi-autopay-s-recurring-woes-are-forcing-an-industry-rethink/93925664
      caveat: >
        THE DATE IS INCONSISTENT ACROSS SOURCES. The search index summarised
        this as August 2025; the article body as read says August 2024. I
        could not resolve which. Also: a 55-90% range across banks is so wide
        that it is really two different facts (some banks work, some do not),
        and the article does not name the banks. Treat the range as the
        finding, not the midpoint.

    - id: autopay_revocations
      tag: REPORTED
      claim: >
        More than 20 million UPI AutoPay mandates are revoked per month
        because customer balances fall short. Categories named: OTT
        subscriptions, loan repayments, SIPs, utilities.
      source: >
        Business Standard, "UPI autopay revocations hit 20 mn per month on low
        customer balance", 7 Sept 2025.
        https://www.business-standard.com/finance/news/upi-autopay-revocations-hit-20-mn-monthly-over-low-customer-balances-125090700500_1.html
      caveat: >
        THE PAGE RETURNED HTTP 403 AND COULD NOT BE READ. This is the search
        engine's summary of it. docs/results.md records the identical 403 on
        a different Business Standard page on 28 August, so this is now a
        repeatable property of that source rather than a one-off.

    - id: autopay_retry_cap
      tag: REPORTED
      claim: >
        From 1 August 2025, each UPI mandate gets one presentation plus at
        most three retries -- four attempts per cycle. PSPs were told to
        implement by 31 July 2025.
      source: https://paytm.com/blog/payments/upi/upi-rules-update-august-1-npci-new-guidelines/
      note: >
        Already in docs/results.md as [REPORTED]. Corroborated again here by
        an independent secondary source. `attempts_cap: 4` in every case below
        rests on this.

    - id: peak_hour_windows
      tag: REPORTED
      claim: >
        AutoPay executions are restricted to non-peak hours: before 10:00,
        13:00-17:00, and after 21:30. Peak is 10:00-13:00 and 17:00-21:30.
      source: https://paytm.com/blog/payments/upi/upi-rules-update-august-1-npci-new-guidelines/
      note: Already in docs/results.md.

    - id: peak_hour_reject_vs_shift
      tag: REPORTED
      claim: >
        A 2026 trade piece describes a debit scheduled for 10:30 as "likely to
        hit a technical decline", i.e. REJECTED, and reported to the merchant
        as a TD.
      source: https://www.republicworld.com/business/upi-autopay-failure-morning-peak-hours-npci-new-rules-2026
      why_this_matters_here: >
        docs/architecture.md asks whether the peak-hour rule hard
        rejects or time-shifts. This is weak evidence for hard reject, which
        is what Stage 0 already assumes -- so it does not change the code. It
        changes the CASES: if a peak-hour rejection surfaces as a technical
        decline, then a burst of TECH can be a scheduling bug of ours rather
        than a broken rail, and the two are indistinguishable in a CaseView.
        GC-14 is built on exactly that.
      caveat: >
        Low-quality secondary source, no NPCI statement, no attribution. It is
        one data point on an open question, not a resolution of it.

    - id: no_afa_threshold
      tag: REPORTED
      claim: >
        AutoPay executions up to Rs 15,000 run without per-transaction
        customer authentication; above it the customer must authenticate each
        execution.
      source: https://www.republicworld.com/business/upi-autopay-failure-morning-peak-hours-npci-new-rules-2026
      why_this_matters_here: >
        It puts a real cliff in the amount axis. GC-36 sits just under it.
        Above the threshold the whole failure mode changes -- the dominant
        failure becomes "the customer did not respond", which is not a thing
        this agent can model at all.

    - id: pre_debit_notification
      tag: REPORTED
      claim: >
        A pre-debit notification must reach the customer at least 24 hours
        before each execution, carrying the exact amount and a cancel option.
      source: https://www.republicworld.com/business/upi-autopay-failure-morning-peak-hours-npci-new-rules-2026
      note: >
        Already in docs/results.md, established there through practitioner
        reports. Corroborated. Consequence used throughout these cases: a
        retry after Z9 needs a FRESH notification and therefore costs at least
        a day, whereas a re-presentation after a technical decline may go
        under the existing one and can happen immediately.

  outages:
    - id: outages_2025
      tag: REPORTED
      claim: >
        26 March 2025: began ~18:00 IST, ~3.5 hours, transaction volume down
        ~7% (~41 million transactions). 2 April 2025: began ~18:39 IST, ~3
        hours, volume down ~5% (~29 million). 12 April 2025 also occurred.
        NPCI attributed the March incident to financial-year-end closing at
        banks and the April one to increased latency and success-rate
        fluctuation at some banks. Described as system-wide, hitting Google
        Pay, PhonePe and Paytm alike.
      source: https://fintechchronicler.substack.com/p/when-indias-digital-lifeline-failed

    - id: outages_2026_are_bank_shaped
      tag: REPORTED
      claim: >
        1 April 2026: disruption concentrated on SBI, HDFC and ICICI
        customers, attributed to financial-year-end closing and server
        maintenance; complaint volume spiked around 11:00. NPCI's own
        statement was that "the UPI system is working fine" and that specific
        banks were declining. A second incident had occurred on 26 March 2026,
        under a week earlier.
      sources:
        - https://punjabtoday.com/upi-down-india-april-1-2026/
        - https://www.deccanherald.com/business/companies/upi-faces-second-outage-in-a-week-3474794
        - https://www.business-standard.com/industry/banking/npci-attributes-upi-outage-to-year-end-transaction-rush-at-banks-125040100968_1.html
      why_this_matters_here: >
        THIS IS THE MOST IMPORTANT RESEARCH FINDING FOR THESE CASES, and it
        partly undercuts our own context layer. The common failure is not "the
        rail is down"; it is "one remitter bank is down". `RailMonitor` pools
        technical declines across ALL customers and ALL banks, so a single-bank
        incident is diluted by every customer who banks elsewhere and may never
        clear `alpha_enter`. Meanwhile the affected customers see an
        unmistakable local burst. That gap -- local evidence strong, aggregate
        statistic quiet -- is precisely the "ambiguous decline burst where a
        judgement call has room to beat the binomial test" the case set is
        supposed to contain. GC-11, GC-12, GC-13, GC-21 and GC-22 are built on
        it.
      honest_caveat: >
        The CaseView carries no bank identifier, so a diagnoser cannot actually
        confirm the single-bank hypothesis. It can only notice that a local
        burst is inconsistent with a quiet aggregate. That is a weaker move
        than it sounds, and cases built on it should not be scored as though
        the diagnoser had the bank.

    - id: outage_severity_still_unknown
      tag: GUESS
      claim: >
        What fraction of AutoPay executions fail inside an outage window is
        still reported nowhere I could find. The nearest measurable proxies
        are the 5% and 7% drops in total UPI VOLUME during the 2025 incidents
        -- but a volume drop is people not transacting, which is not the same
        as attempts failing, and for a scheduled machine-initiated debit it
        may be nearly unrelated.
      why_this_matters_here: >
        docs/results.md sweeps severity at 0.15 / 0.40 / 0.80 and says
        outright that severity is invented. Nothing found changes that. If
        anything the volume evidence hints that real severities sit at the
        very bottom of that sweep or below it, which would make the +0.256 pt
        ceiling on outage awareness an over-estimate rather than an
        under-estimate. That is a reason to be MORE sceptical of pausing, not
        less. Stated as a GUESS because a volume drop is not a decline rate.

  what_i_could_not_find:
    - >
      ANY published distribution of decline codes for AutoPay MANDATE
      EXECUTION specifically. Every breakdown found is for interactive UPI
      payments, where a human types a PIN. Nobody publishes "of failed
      mandate executions, x% were Z9, y% were U28". Without it, the frequency
      weighting of this case set is my judgement and nothing more -- I have
      weighted it toward Z9 and toward technical bursts because the
      simulation's world is built that way, NOT because a source says so.
    - >
      NPCI's own AutoPay Ecosystem Statistics page
      (https://www.npci.org.in/what-we-do/autopay/ecosystem-statistics)
      returned HTTP 403 and could not be read. It is the one source that
      would most likely settle the previous item. Someone with a browser and
      an Indian IP should try it; it is probably an hour of work and it would
      be worth more than anything else in this research block.
    - >
      Bank-wise AutoPay execution success rates. The 55-90% range implies
      enormous bank-to-bank variation, but no source names which banks sit at
      which end. So there are no bank-specific cases in this set -- and there
      could not be, because `CaseView` carries no bank field. Whether it
      SHOULD is a real design question this research raises and I have not
      answered.
    - >
      Any documented outage that names AutoPay mandate execution as affected.
      Every incident report is about person-to-person and person-to-merchant
      payments. docs/results.md already tags the read-across to mandate
      execution as [GUESS]; nothing found this time improves on that, and I
      am not able to say that mandate debits failed during any of the 2025 or
      2026 incidents.
    - >
      A resolution of docs/architecture.md -- whether exhausting the
      four attempts CANCELS the mandate or merely halts collection for the
      cycle. Secondary sources say "the payment will be cancelled", which is
      about the payment, not the mandate, and one of them then says the
      mandate "becomes inactive for that billing period", which is the other
      reading. Both appear in the same paragraph of the same summary. Still
      unresolved, and it matters a great deal: it is the entire value of STOP.
      Every STOP case below (GC-05, GC-25, GC-27, GC-29, GC-37) is therefore
      resting on an unresolved fact, and I have said so in each.
    - >
      Whether a partial debit is permitted under a single UPI AutoPay mandate.
      Nothing found either way. `InterventionKind` deliberately has no PARTIAL
      for this reason; it survives only as a recommendation string. Unchanged.
    - >
      Any merchant publishing real recurring-payment recovery numbers. Plenty
      of PSP blogs assert improvements; none shows a denominator. The 6-8%
      retry-optimisation benchmark already in docs/results.md remains the only
      number of that kind, and its "points or percent?" ambiguity is still
      unresolved.

# =============================================================================
# HOW THE CASES ARE DISTRIBUTED
# =============================================================================
# Ambiguous cases outnumber clean ones roughly 21 to 19, as asked. The clean
# ones are here as anchors: a diagnoser that gets GC-20 or GC-40 wrong is
# broken, and knowing that is worth the four lines it costs.
#
#   GC-01..GC-04   clean anchors: early cycle, first decline, single TECH
#   GC-05..GC-10   funding and peer-signal cases, several genuinely two-sided
#   GC-11..GC-24   THE CORE. Ambiguous technical-decline bursts, near the
#                  threshold where the rail monitor cannot help and judgement
#                  has room to beat it
#   GC-25..GC-29   stopping and mandate-death
#   GC-30..GC-32   the peer signal on its own -- the moat, made visible
#   GC-33..GC-35   untrusted merchant_note
#   GC-36..GC-38   amount-driven
#   GC-39..GC-40   edge cases that probe the view and the loop, not the world
# =============================================================================

cases:

# ---------------------------------------------------------------- ANCHORS ---

  - id: GC-01
    title: Fresh cycle, account known good
    situation: >
      First billing day of a new cycle for a Rs 499 subscription. Nothing has
      failed yet, we are fairly sure when this customer gets paid, and another
      subscription on the same account cleared in the last few days.
    case_view:
      attempts_used: 0
      attempts_cap: 4
      day_in_cycle: 0
      days_left_in_cycle: 30
      amount: 499
      decline_history: []
      n_recent_z9: 0
      peer_mandate_success_recent: true
      uncertainty_band: narrow
      merchant_note: ""
    real_world_grounding: >
      The ordinary case. Most executions succeed; the 55-90% failure figure is
      a bank-level range, not the whole population.
    correct_root_cause: TIMING_MISMATCH
    correct_intervention: RETRY
    expert_agreement: 0.95
    ambiguous: false
    defensible_alternative: null
    notes: >
      Root cause is awkward here -- nothing has failed, so no cause is really
      correct. TIMING_MISMATCH is the least wrong. If a diagnoser returns
      UNKNOWN with RETRY that should not be marked down. The intervention is
      the graded field.

  - id: GC-02
    title: Fresh cycle, we do not know this customer yet
    situation: >
      First billing day, nothing has failed, but our model has no idea when
      this customer gets paid and no other subscription on the account has
      cleared recently.
    case_view:
      attempts_used: 0
      attempts_cap: 4
      day_in_cycle: 0
      days_left_in_cycle: 30
      amount: 299
      decline_history: []
      n_recent_z9: 0
      peer_mandate_success_recent: false
      uncertainty_band: wide
      merchant_note: ""
    real_world_grounding: >
      A new mandate. Registrations ran to ~50 million a month in July 2025
      [REPORTED], so a large share of the live population is always cold-start.
    correct_root_cause: UNKNOWN
    correct_intervention: RETRY
    expert_agreement: 0.85
    ambiguous: false
    defensible_alternative: null
    notes: >
      Wide uncertainty is not a reason to sit out. Four attempts across thirty
      days is a generous budget, the first attempt is also the cheapest
      information we will ever buy about this account, and declining to
      present at all forfeits the cycle for nothing.

  - id: GC-03
    title: First insufficient-funds decline, early in the cycle
    situation: >
      One Rs 999 debit came back as insufficient funds on day 2. Twenty-eight
      days of cycle and three attempts remain.
    case_view:
      attempts_used: 1
      attempts_cap: 4
      day_in_cycle: 2
      days_left_in_cycle: 28
      amount: 999
      decline_history: ["Z9"]
      n_recent_z9: 1
      peer_mandate_success_recent: false
      uncertainty_band: medium
      merchant_note: ""
    real_world_grounding: >
      Z9, INSUFFICIENT FUNDS IN CUSTOMER (REMITTER) ACCOUNT [VERIFIED]. The
      single most cited cause of AutoPay failure [REPORTED].
    correct_root_cause: INSUFFICIENT_FUNDS
    correct_intervention: NUDGE
    expert_agreement: 0.8
    ambiguous: false
    defensible_alternative: null
    notes: >
      A nudge costs no attempt and no notification. A retry after Z9 needs a
      fresh 24-hour pre-debit notification anyway, so nudging first is close to
      free. This is the branch the action-space ablation should show is worth
      something; if it is not, it should be cut.

  - id: GC-04
    title: One technical decline, nothing else
    situation: >
      A Rs 199 debit failed for a technical reason on day 1. No funding
