    case_view:
      attempts_used: 2
      attempts_cap: 4
      day_in_cycle: 11
      days_left_in_cycle: 19
      amount: 899
      decline_history: ["TECH", "Z9", "TECH", "Z9"]
      n_recent_z9: 2
      peer_mandate_success_recent: false
      uncertainty_band: medium
      merchant_note: ""
    real_world_grounding: Identical to GC-16.
    correct_root_cause: INSUFFICIENT_FUNDS
    correct_intervention: NUDGE
    expert_agreement: 0.85
    ambiguous: false
    defensible_alternative: null
    notes: >
      The control for GC-16. Same answer, much higher agreement, because
      nothing here is fighting the intuition. Any diagnoser that answers GC-16
      and GC-17 differently should have to justify why the order of four
      failures spread over eleven days changes what to do on day 11.

  - id: GC-18
    title: Six consecutive technical declines spanning two cycles
    situation: >
      Every recorded attempt on this Rs 249 subscription -- six of them, across
      this cycle and the last -- has failed for a technical reason. It has
      never once collected.
    case_view:
      attempts_used: 3
      attempts_cap: 4
      day_in_cycle: 2
      days_left_in_cycle: 28
      amount: 249
      decline_history: ["TECH", "TECH", "TECH", "TECH", "TECH", "TECH"]
      n_recent_z9: 0
      peer_mandate_success_recent: false
      uncertainty_band: wide
      merchant_note: ""
    real_world_grounding: >
      No outage lasts across two billing cycles; the longest single UPI
      incident on record is around 207 minutes [REPORTED, docs/results.md].
      Six for six is a permanent condition, and the NPCI list has a whole
      family for it: VU mandate has expired, VT mandate is paused, VA mandate
      revoked, VF UMN does not exist, VJ payer account has changed [VERIFIED].
      Several of these would reach a merchant as an undifferentiated failure.
    correct_root_cause: TECHNICAL
    correct_intervention: ESCALATE
    expert_agreement: 0.75
    ambiguous: true
    defensible_alternative:
      intervention: STOP
      why: >
        If nothing has ever collected, there is no case for spending the fourth
        attempt, and a human may have nothing to act on either.
    notes: >
      The extreme end of the technical-burst axis, included so the set has one.
      Note the honest weakness of the whole block: none of these cases can
      actually confirm the mandate-level hypothesis, because the CaseView
      carries no NPCI response code -- only our three-way OK/Z9/TECH. What is
      being graded is whether a diagnoser notices that six-for-six across two
      cycles is a different KIND of thing from three-in-a-row on one day.

  - id: GC-19
    title: Two technical declines with the cycle nearly over
    situation: >
      Two technical failures on a Rs 449 subscription. Two days of cycle left,
      two attempts left, and no idea when the customer is paid.
    case_view:
      attempts_used: 2
      attempts_cap: 4
      day_in_cycle: 28
      days_left_in_cycle: 2
      amount: 449
      decline_history: ["TECH", "TECH"]
      n_recent_z9: 0
      peer_mandate_success_recent: false
      uncertainty_band: wide
      merchant_note: ""
    real_world_grounding: Same transient family as GC-11.
    correct_root_cause: TECHNICAL
    correct_intervention: RETRY
    expert_agreement: 0.85
    ambiguous: false
    defensible_alternative: null
    notes: >
      PAIRED WITH GC-11: the same two-technical-decline evidence, but with the
      cycle almost closed. Here the argument for waiting collapses, because
      there is nothing left to wait for -- an unspent attempt at cycle close is
      worth nothing. Same evidence, different budget, different answer. That is
      the shape I want a diagnoser to have.

  - id: GC-20
    title: Long-running healthy mandate, one technical blip
    situation: >
      A Rs 3,999 mandate that has collected twice recently just failed once for
